# Publishes site/ (plus the 7 Armenian solution PDFs) to GitHub Pages.
# The QA script must pass first; a failing check blocks the deploy.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "discrete/solutions_opus_4_8_ARM/*.pdf"
      - "tools/check_site.mjs"
      - "tools/build_search_index.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: QA (KaTeX render, Armenian punctuation, links)
        run: node tools/check_site.mjs
      - name: Rebuild the search index (site/assets/search/*.js) from the pages being deployed
        run: node tools/build_search_index.mjs
      - name: Copy the Armenian PDFs into the site
        run: |
          mkdir -p site/pdf
          cp discrete/solutions_opus_4_8_ARM/*.pdf site/pdf/
          ls -la site/pdf
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
