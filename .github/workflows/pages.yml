# Publishes site/ (plus the 7 Armenian solution PDFs) to GitHub Pages.
# The QA script and the browser smoke test must pass first; a failing check blocks the deploy.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "discrete/solutions_opus_4_8_ARM/*.pdf"
      - "tools/check_site.mjs"
      - "tools/build_search_index.mjs"
      - "tools/browser_check.mjs"
      - "tools/package.json"
      - "tools/package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: QA (KaTeX render, Armenian punctuation, links)
        run: node tools/check_site.mjs
      - name: Rebuild the search index (site/assets/search/*.js) from the pages being deployed
        run: node tools/build_search_index.mjs
      - name: Copy the Armenian PDFs into the site
        run: |
          mkdir -p site/pdf
          cp discrete/solutions_opus_4_8_ARM/*.pdf site/pdf/
          ls -la site/pdf
      # GitHub Pages lets browsers cache assets for 10 minutes (max-age=600). Without a version in the URL a
      # returning visitor can get new HTML with the old site.css / site.js right after a deploy. Only the
      # deployed copy is rewritten; the repo keeps plain links, so pages still open from a clone.
      - name: Cache-bust local CSS/JS links with ?v=<commit>
        run: |
          v="${GITHUB_SHA::8}"
          find site -name '*.html' -print0 | xargs -0 sed -i -E "s#((href|src)=\"[^\"?]*assets/[^\"?]+\.(css|js))\"#\1?v=${v}\"#g"
          n=$(grep -rhoE 'assets/[^"?]+\.(css|js)\?v=[0-9a-f]{8}"' site --include='*.html' | wc -l)
          bad=$(grep -rhoE 'assets/[^"]+\.(css|js)\?v=[0-9a-f]{8}[^"]' site --include='*.html' | wc -l)
          echo "versioned $n asset links with v=$v ($bad malformed)"
          test "$n" -gt 100 && test "$bad" -eq 0
      # Runs last, on exactly the files that get uploaded (search index rebuilt, links versioned). It opens
      # every page in the runner's own Chrome at 390 px and fails on script errors, failed requests, KaTeX
      # errors, formulas wider than the column and widgets that drew nothing. About a minute.
      - name: Browser smoke test (every page in Chrome at phone width)
        run: |
          npm ci --prefix tools --no-audit --no-fund
          node tools/browser_check.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
